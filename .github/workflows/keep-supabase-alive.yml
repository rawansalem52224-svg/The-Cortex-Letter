name: Keep Supabase Project Alive

on:
  schedule:
    - cron: '0 13 * * 1,4'   # Mondays and Thursdays, 1:00 PM UTC
  workflow_dispatch:

jobs:
  ping-project:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase database
        run: |
          curl --fail --show-error --silent \
            "${{ secrets.SUPABASE_URL }}/rest/v1/posts?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
